<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>__TITLE__</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 2em auto;
      max-width: 800px;
      padding: 0 1em 4em;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 1.4em;
      margin-bottom: 0.2em;
    }

    h2 {
      margin-top: 2em;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3em;
      font-size: 1.15em;
    }

    h3 {
      margin: 1.2em 0 0.3em;
      font-size: 1em;
      color: #444;
    }

    table.kv {
      border-collapse: collapse;
      font-size: 0.95em;
    }

    table.kv td {
      padding: 0.15em 1.2em 0.15em 0;
      vertical-align: top;
    }

    table.kv td:first-child {
      font-weight: 600;
    }

    table.sequence {
      border-collapse: collapse;
      font-size: 0.9em;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
    }

    table.sequence td {
      padding: 0.1em 1em 0.1em 0;
      vertical-align: top;
    }

    table.sequence td:first-child {
      color: #aaa;
      text-align: right;
      user-select: none;
      padding-right: 1.5em;
    }

    table.sequence td:nth-child(2) {
      text-align: right;
      padding-right: 1.5em;
    }

    .ext-tag,
    .trap-tag,
    .adc-tag,
    .free-tag {
      position: relative;
      cursor: pointer;
    }

    .ext-tag {
      color: #0366d6;
    }

    .trap-tag {
      color: #1a7f37;
    }

    .adc-tag {
      color: #cf222e;
    }

    .free-tag {
      color: #bf5700;
    }

    .ext-tag:hover,
    .trap-tag:hover,
    .adc-tag:hover,
    .free-tag:hover {
      text-decoration: underline;
    }

    .trap-tag:hover .ext-popup,
    .adc-tag:hover .ext-popup,
    .free-tag:hover .ext-popup {
      display: block;
    }

    .shape-link {
      position: relative;
      color: #0366d6;
      cursor: pointer;
    }

    .shape-link:hover {
      text-decoration: underline;
    }

    .shape-popup {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 200;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      padding: 0.4em;
    }

    .shape-link:hover .shape-popup {
      display: block;
    }

    .grad-plot {
      width: 480px;
      height: 240px;
    }

    .ext-popup {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 0.5em 0.8em;
      min-width: 180px;
      max-width: 460px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.85em;
      color: #222;
    }

    .ext-tag:hover .ext-popup {
      display: block;
    }

    .ext-popup ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ext-popup li {
      padding: 0.15em 0;
    }

    .ext-popup li strong {
      margin-right: 0.4em;
    }

    .meta {
      color: #586069;
      font-size: 0.9em;
    }

    .empty {
      color: #888;
      font-style: italic;
    }
  </style>
</head>

<body>
  <h1>__TITLE__</h1>
  <p class="meta">__META__</p>

  <section>
    <h2>Definitions</h2>
    __DEFINITIONS__
  </section>

  <section>
    <h2>Sequence</h2>
    __SEQUENCE__
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var common = { margin: { t: 10, r: 10, b: 30, l: 40 }, showlegend: false };
      /*__PLOT_SCRIPTS__*/
    });
  </script>
</body>

</html>
